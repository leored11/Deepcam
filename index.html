<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Deep Live Cam - Samsung Fix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
            color: #fff;
            overflow: hidden;
            touch-action: none;
        }
        
        #camera-container {
            position: fixed;
            inset: 0;
            background: #000;
            display: none;
        }
        
        #webcam {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }
        
        #output-canvas {
            position: absolute;
            width: 100%;
            height: 100%;
            transform: scaleX(-1);
        }
        
        #mesh-overlay {
            position: absolute;
            inset: 0;
            transform: scaleX(-1);
            pointer-events: none;
        }
        
        .face-mesh-point {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #00ffff;
            border-radius: 50%;
            box-shadow: 0 0 8px #00ffff;
        }
        
        /* Start Screen */
        #start-screen {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            text-align: center;
        }
        
        .logo {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #00ffff, #0088ff);
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0, 255, 255, 0.3);
        }
        
        .start-btn {
            width: 100%;
            max-width: 280px;
            padding: 18px 24px;
            background: #fff;
            color: #000;
            border: none;
            border-radius: 16px;
            font-size: 17px;
            font-weight: 700;
            margin-top: 30px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .start-btn:active {
            transform: scale(0.98);
        }
        
        .start-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .permission-text {
            font-size: 14px;
            color: rgba(255,255,255,0.7);
            margin-top: 20px;
            line-height: 1.6;
        }
        
        /* Loading */
        #loading {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.95);
            z-index: 999;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top-color: #00ffff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Error Screen */
        #error-screen {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.95);
            z-index: 2000;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            text-align: center;
        }
        
        .error-icon {
            width: 80px;
            height: 80px;
            background: rgba(255,68,68,0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            font-size: 40px;
        }
        
        .retry-btn {
            padding: 16px 32px;
            background: #00ffff;
            color: #000;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            margin-top: 20px;
            cursor: pointer;
        }
        
        /* UI Overlay */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 50px 20px 20px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }
        
        .status-badge {
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(255,255,255,0.2);
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #00ff88;
            box-shadow: 0 0 10px #00ff88;
        }
        
        .status-dot.loading {
            background: #ffaa00;
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        
        /* Face Box */
        #face-box {
            position: absolute;
            border: 2px solid #00ffff;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0,255,255,0.3);
            display: none;
            pointer-events: none;
        }
        
        #face-box::before {
            content: 'FACE DETECTED';
            position: absolute;
            top: -28px;
            left: 0;
            background: #00ffff;
            color: #000;
            font-size: 10px;
            font-weight: 800;
            padding: 4px 12px;
            border-radius: 4px;
        }
        
        /* Bottom Controls */
        .controls {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
            padding: 30px 20px 40px;
            z-index: 100;
        }
        
        .mode-toggle {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
        }
        
        .mode-btn {
            padding: 12px 24px;
            border-radius: 25px;
            border: 1px solid rgba(255,255,255,0.3);
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .mode-btn.active {
            background: #00ffff;
            color: #000;
            border-color: #00ffff;
        }
        
        .action-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
        }
        
        .action-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .action-btn:active {
            transform: scale(0.95);
        }
        
        .btn-capture {
            background: #fff;
            color: #000;
        }
        
        .btn-upload {
            background: rgba(255,255,255,0.2);
            color: #fff;
            border: 2px solid rgba(255,255,255,0.3);
        }
        
        .btn-record {
            background: rgba(255,68,68,0.2);
            color: #ff4444;
            border: 2px solid rgba(255,68,68,0.5);
        }
        
        .btn-record.recording {
            background: #ff4444;
            color: #fff;
            animation: pulse 1.5s infinite;
        }
        
        #file-input {
            display: none;
        }
        
        /* Toast */
        .toast {
            position: fixed;
            top: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: rgba(0,0,0,0.9);
            color: #fff;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 500;
            opacity: 0;
            transition: all 0.3s;
            z-index: 3000;
            border: 1px solid rgba(255,255,255,0.2);
        }
        
        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>

    <!-- Start Screen -->
    <div id="start-screen">
        <div class="logo">
            <svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5">
                <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                <line x1="12" y1="19" x2="12" y2="23"/>
            </svg>
        </div>
        <h1 style="font-size: 32px; font-weight: 800; margin-bottom: 10px;">Deep Live Cam</h1>
        <p style="color: rgba(255,255,255,0.7); font-size: 16px;">Real-time face synthesis</p>
        
        <button class="start-btn" id="start-btn" onclick="startCamera()">
            Start Camera
        </button>
        
        <p class="permission-text">
            Camera access is required.<br>
            Tap "Allow" when prompted.
        </p>
    </div>

    <!-- Loading -->
    <div id="loading">
        <div class="spinner"></div>
        <p style="margin-top: 20px; color: rgba(255,255,255,0.8);">Starting camera...</p>
    </div>

    <!-- Error Screen -->
    <div id="error-screen">
        <div class="error-icon">⚠️</div>
        <h2 style="font-size: 24px; margin-bottom: 10px;">Camera Access Denied</h2>
        <p style="color: rgba(255,255,255,0.7); margin-bottom: 20px; line-height: 1.6;">
            Please allow camera access in your browser settings:<br>
            Settings → Privacy → Camera → Allow
        </p>
        <button class="retry-btn" onclick="retryCamera()">Try Again</button>
        <button class="retry-btn" style="background: transparent; color: #fff; border: 1px solid rgba(255,255,255,0.3); margin-top: 10px;" onclick="showSettingsHelp()">
            How to Enable
        </button>
    </div>

    <!-- Camera Container -->
    <div id="camera-container">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="output-canvas"></canvas>
        <div id="mesh-overlay"></div>
        
        <div id="face-box">
            <div style="position: absolute; top: -2px; left: -2px; width: 20px; height: 20px; border-top: 3px solid #00ffff; border-left: 3px solid #00ffff;"></div>
            <div style="position: absolute; top: -2px; right: -2px; width: 20px; height: 20px; border-top: 3px solid #00ffff; border-right: 3px solid #00ffff;"></div>
            <div style="position: absolute; bottom: -2px; left: -2px; width: 20px; height: 20px; border-bottom: 3px solid #00ffff; border-left: 3px solid #00ffff;"></div>
            <div style="position: absolute; bottom: -2px; right: -2px; width: 20px; height: 20px; border-bottom: 3px solid #00ffff; border-right: 3px solid #00ffff;"></div>
        </div>

        <!-- Top Bar -->
        <div class="top-bar">
            <div class="status-badge">
                <div class="status-dot loading" id="status-dot"></div>
                <span id="status-text">Initializing...</span>
            </div>
            <button onclick="flipCamera()" style="background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.3); width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M11 19H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h5"/>
                    <path d="M13 5h7a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-5"/>
                    <circle cx="12" cy="12" r="3"/>
                    <path d="m18 22-3-3 3-3"/>
                    <path d="m6 2 3 3-3 3"/>
                </svg>
            </button>
        </div>

        <!-- Controls -->
        <div class="controls">
            <div class="mode-toggle">
                <button class="mode-btn active" onclick="setMode('mesh', this)">Face Mesh</button>
                <button class="mode-btn" onclick="setMode('swap', this)">Deep Swap</button>
            </div>
            
            <div class="action-buttons">
                <button class="action-btn btn-upload" onclick="document.getElementById('file-input').click()">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="17 8 12 3 7 8"/>
                        <line x1="12" y1="3" x2="12" y2="15"/>
                    </svg>
                </button>
                
                <button class="action-btn btn-capture" onclick="capture()">
                    <div style="width: 54px; height: 54px; border-radius: 50%; border: 3px solid #000;"></div>
                </button>
                
                <button class="action-btn btn-record" id="record-btn" onclick="toggleRecord()">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="6"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <input type="file" id="file-input" accept="image/*" onchange="handleFile(event)">
    <div id="toast" class="toast"></div>

    <script>
        // State
        let faceMesh = null;
        let video = document.getElementById('webcam');
        let canvas = document.getElementById('output-canvas');
        let ctx = canvas.getContext('2d');
        let currentMode = 'mesh';
        let targetImage = null;
        let isRecording = false;
        let mediaRecorder = null;
        let recordedChunks = [];
        let currentFacingMode = 'user';
        let stream = null;
        let isProcessing = false;

        // Samsung Internet specific: Check if getUserMedia is available
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            showToast('Your browser does not support camera access. Please use Chrome.', 'error');
        }

        async function startCamera() {
            const btn = document.getElementById('start-btn');
            btn.disabled = true;
            btn.textContent = 'Requesting...';
            
            document.getElementById('loading').style.display = 'flex';
            
            try {
                // Initialize MediaPipe first
                faceMesh = new FaceMesh({locateFile: (file) => {
                    return `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`;
                }});
                
                faceMesh.setOptions({
                    maxNumFaces: 1,
                    refineLandmarks: true,
                    minDetectionConfidence: 0.5,
                    minTrackingConfidence: 0.5
                });
                
                faceMesh.onResults(onResults);
                
                // Try to get camera with specific constraints for Samsung
                const constraints = {
                    video: {
                        facingMode: currentFacingMode,
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false
                };
                
                // Samsung Internet sometimes needs this explicit call
                stream = await navigator.mediaDevices.getUserMedia(constraints);
                
                video.srcObject = stream;
                
                // Wait for video to be ready
                await new Promise((resolve, reject) => {
                    video.onloadedmetadata = () => {
                        video.play().then(resolve).catch(reject);
                    };
                    video.onerror = reject;
                    setTimeout(() => reject(new Error('Video load timeout')), 10000);
                });
                
                // Set canvas size
                canvas.width = video.videoWidth || 1280;
                canvas.height = video.videoHeight || 720;
                
                // Switch screens
                document.getElementById('start-screen').style.display = 'none';
                document.getElementById('loading').style.display = 'none';
                document.getElementById('camera-container').style.display = 'block';
                
                // Update status
                document.getElementById('status-dot').classList.remove('loading');
                document.getElementById('status-text').textContent = 'Live';
                
                // Start processing
                isProcessing = true;
                processFrame();
                
                showToast('Camera started! Point at your face.', 'success');
                
            } catch (err) {
                console.error('Camera error:', err);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error-screen').style.display = 'flex';
                document.getElementById('start-screen').style.display = 'none';
            }
        }

        function retryCamera() {
            document.getElementById('error-screen').style.display = 'none';
            document.getElementById('start-screen').style.display = 'flex';
            document.getElementById('start-btn').disabled = false;
            document.getElementById('start-btn').textContent = 'Start Camera';
        }

        function showSettingsHelp() {
            alert('To enable camera:\n\n1. Open Samsung Internet Settings (three lines menu)\n2. Tap "Privacy"\n3. Tap "Camera"\n4. Find this site and select "Allow"\n5. Refresh the page');
        }

        async function processFrame() {
            if (!isProcessing) return;
            
            try {
                if (video.readyState >= 2) {
                    await faceMesh.send({image: video});
                }
            } catch (e) {
                console.error('Processing error:', e);
            }
            
            requestAnimationFrame(processFrame);
        }

        function onResults(results) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw video frame
            if (results.image) {
                ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height);
            }
            
            const faceBox = document.getElementById('face-box');
            
            if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
                const landmarks = results.multiFaceLandmarks[0];
                
                // Calculate face box
                let minX = 1, minY = 1, maxX = 0, maxY = 0;
                landmarks.forEach(lm => {
                    minX = Math.min(minX, lm.x);
                    minY = Math.min(minY, lm.y);
                    maxX = Math.max(maxX, lm.x);
                    maxY = Math.max(maxY, lm.y);
                });
                
                // Update face box
                const padding = 0.1;
                faceBox.style.display = 'block';
                faceBox.style.left = ((minX - padding) * 100) + '%';
                faceBox.style.top = ((minY - padding) * 100) + '%';
                faceBox.style.width = (((maxX - minX) + padding * 2) * 100) + '%';
                faceBox.style.height = (((maxY - minY) + padding * 2) * 100) + '%';
                
                if (currentMode === 'mesh') {
                    drawMesh(landmarks);
                } else {
                    drawSwap(landmarks);
                }
            } else {
                faceBox.style.display = 'none';
                document.getElementById('mesh-overlay').innerHTML = '';
            }
        }

        function drawMesh(landmarks) {
            const overlay = document.getElementById('mesh-overlay');
            overlay.innerHTML = '';
            
            // Draw points (skip some for performance)
            landmarks.forEach((lm, i) => {
                if (i % 5 === 0) {
                    const dot = document.createElement('div');
                    dot.className = 'face-mesh-point';
                    dot.style.left = (lm.x * 100) + '%';
                    dot.style.top = (lm.y * 100) + '%';
                    overlay.appendChild(dot);
                }
            });
            
            // Draw connections
            ctx.strokeStyle = 'rgba(0, 255, 255, 0.4)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            
            const connections = FaceMesh.FACEMESH_TESSELATION;
            connections.forEach(([start, end]) => {
                const s = landmarks[start];
                const e = landmarks[end];
                ctx.moveTo(s.x * canvas.width, s.y * canvas.height);
                ctx.lineTo(e.x * canvas.width, e.y * canvas.height);
            });
            ctx.stroke();
        }

        function drawSwap(landmarks) {
            document.getElementById('mesh-overlay').innerHTML = '';
            
            if (!targetImage) {
                // Color effect
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = imageData.data;
                for (let i = 0; i < data.length; i += 4) {
                    data[i] = Math.min(255, data[i] * 1.2);
                    data[i + 2] = Math.min(255, data[i + 2] * 1.3);
                }
                ctx.putImageData(imageData, 0, 0);
                return;
            }
            
            // Face swap with target image
            let minX = 1, minY = 1, maxX = 0, maxY = 0;
            landmarks.forEach(lm => {
                minX = Math.min(minX, lm.x);
                minY = Math.min(minY, lm.y);
                maxX = Math.max(maxX, lm.x);
                maxY = Math.max(maxY, lm.y);
            });
            
            const width = (maxX - minX) * canvas.width * 1.4;
            const height = (maxY - minY) * canvas.height * 1.4;
            const x = minX * canvas.width - width * 0.2;
            const y = minY * canvas.height - height * 0.2;
            
            ctx.save();
            ctx.globalAlpha = 0.6;
            ctx.beginPath();
            ctx.ellipse(
                (minX + maxX) / 2 * canvas.width,
                (minY + maxY) / 2 * canvas.height,
                width / 2.2,
                height / 2.2,
                0, 0, 2 * Math.PI
            );
            ctx.clip();
            ctx.drawImage(targetImage, x, y, width, height);
            ctx.restore();
        }

        async function flipCamera() {
            currentFacingMode = currentFacingMode === 'user' ? 'environment' : 'user';
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
            
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: currentFacingMode },
                    audio: false
                });
                video.srcObject = stream;
                showToast('Camera flipped', 'success');
            } catch (err) {
                showToast('Cannot flip camera', 'error');
            }
        }

        function setMode(mode, btn) {
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function handleFile(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    targetImage = img;
                    showToast('Face photo loaded!', 'success');
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        function capture() {
            const link = document.createElement('a');
            link.download = 'deepcam-' + Date.now() + '.jpg';
            link.href = canvas.toDataURL('image/jpeg', 0.9);
            link.click();
            showToast('Photo saved!', 'success');
        }

        function toggleRecord() {
            const btn = document.getElementById('record-btn');
            
            if (!isRecording) {
                const stream = canvas.captureStream(30);
                mediaRecorder = new MediaRecorder(stream);
                recordedChunks = [];
                
                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) recordedChunks.push(e.data);
                };
                
                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: 'video/webm' });
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = 'deepcam-' + Date.now() + '.webm';
                    link.click();
                };
                
                mediaRecorder.start();
                isRecording = true;
                btn.classList.add('recording');
                showToast('Recording started', 'success');
            } else {
                mediaRecorder.stop();
                isRecording = false;
                btn.classList.remove('recording');
                showToast('Video saved!', 'success');
            }
        }

        function showToast(msg, type) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = 'toast show';
            if (type === 'error') toast.style.borderColor = '#ff4444';
            else if (type === 'success') toast.style.borderColor = '#00ff88';
            
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // Handle page visibility
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                isProcessing = false;
            } else {
                isProcessing = true;
                processFrame();
            }
        });
    </script>
</body>
</html>
